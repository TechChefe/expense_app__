name: expense_app
description: A daily expense tracking and monitoring application for the Mobile & Pervasive Computing course.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Database
  sqflite: ^2.3.0
  path: ^1.9.0

  # State Management
  provider: ^6.1.1

  # Location
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # UI
  cupertino_icons: ^1.0.6
  fl_chart: ^0.67.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
